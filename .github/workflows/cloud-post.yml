name: cloud-post

# Stündlich: einen frischen Twitch-Clip erzeugen und SOFORT über Zernio posten.
# Läuft komplett in der Cloud -> PC aus, nichts zu tun.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Testlauf OHNE Posten (nur produzieren)?"
        type: boolean
        default: false
  schedule:
    # Stündlich 07–22 Uhr Europe/Berlin (Sommerzeit = UTC+2 -> 05–20 UTC).
    - cron: "0 5-20 * * *"

permissions:
  contents: write   # State (Dedup-DB/Ledger) zurueck ins Repo

concurrency:
  group: cloud-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg + Schrift (für Titel oben)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation

      - name: Pip cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Python-Deps
        run: |
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Warteschlange auffuellen (produzieren + in Zernio einplanen)
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python scripts/cloud_run.py --no-schedule --target 10 --max-new 4
          else
            python scripts/cloud_run.py --target 10 --max-new 6
          fi

      - name: State zurueck ins Repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/clips.db data/posted_log.json data/rotation_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "kein State-Update"
          else
            git commit -m "cloud: state update [skip ci]"
            git push
          fi
