# Globale Defaults für alle Creator (überschreibbar pro Creator)
defaults:
  clip:
    min_duration_sec: 61       # > 60 Sek. wegen TikTok Creator Rewards (hart erzwungen)
    max_duration_sec: 90
    aspect_ratio: "9:16"
    reframe_mode: face_split   # Gesicht des Streamers GROSS oben, Originalvideo unten
    face_fill: 0.44            # Gesichtshöhe im oberen Panel (höher = näher dran)
    face_max_zoom: 3.2         # Vergrößerungs-Deckel (höher = größer, aber unschärfer)
    face_center_y: 0.54        # Gesichtsmitte im oberen Panel (Platz für den Titel)
    face_detect_frames: 9      # Stichproben-Frames für die Gesichtserkennung
    burn_subtitles: true
    show_creator_credit: false # kein eingebrannter Credit-Text im Video
    max_clips_per_source: 1    # nur der EINE beste Moment je Video (max. Vielfalt)
    min_viral_score: 7.5       # Viralitäts-Gate (0-10): nur Top-Segmente posten (3 Videos/Tag)
    window_if_longer_than_sec: 14400 # nur >4h (Twitch-VODs) fenstern; YouTube voll laden (zuverlässiger)
    vod_window_sec: 360        # Länge des Scan-Fensters (6 min – schneller in der Cloud)
    vod_window_start_sec: 1800 # Start des Scan-Fensters (30 min, Intro überspringen)
  posting:
    per_account_per_day: 2
    require_human_review: true # zu Beginn manuelle Freigabe (später lockern)
