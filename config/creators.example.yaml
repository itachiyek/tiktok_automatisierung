# Creator-Profile für die Clip-Pipeline.
# Kopieren nach config/creators.yaml und mit echten Werten/IDs füllen.
# Hinweis: KEINE API-Keys/Tokens hier ablegen — die kommen aus Env-Variablen/Secret-Store.

creators:
  - id: trymacs
    name: Trymacs
    consent: true              # schriftliche Einwilligung liegt vor (Datum/Doku referenzieren)
    revenue_share: 0.30        # Anteil an den Creator (Beispielwert, noch festlegen)
    sources:
      twitch:
        login: trymacs
        pull_existing_clips: true   # Community-Clips = vorkuratierte Highlights (Top-Quelle)
        pull_vods: true
      youtube:
        channel_id: "UC_XXXXXXXXXXXXXXXXXXXXXX"   # Haupt-Channel-ID eintragen
        monitor_uploads: true
    tiktok_account: "@trymacs.clips"
    # zernio_account_id: ""      # optional: exakte Zernio-Konto-ID (sonst per @handle aufgelöst)
    #                            #   -> IDs zeigen:  python3 -m src.cli zernio-accounts
    style:
      language: de
      niche: [gaming, eafc, reaction, entertainment]
      tone: "hyped, jugendlich, viel Energie"

  - id: eligella
    name: Eligella
    consent: true
    revenue_share: 0.30
    sources:
      twitch:
        login: eligella
        pull_existing_clips: true
        pull_vods: true
      youtube:
        channel_id: "UC_XXXXXXXXXXXXXXXXXXXXXX"
        monitor_uploads: true
    tiktok_account: "@eligella.clips"
    style:
      language: de
      niche: [variety, just_chatting, gaming]
      tone: "locker, witzig, nahbar"

  - id: sidney
    name: Sidney
    consent: true
    revenue_share: 0.30
    sources:
      twitch:
        login: sidney            # exakten Twitch-Login prüfen/eintragen
        pull_existing_clips: true
        pull_vods: true
      youtube:
        channel_id: "UC_XXXXXXXXXXXXXXXXXXXXXX"
        monitor_uploads: true
    tiktok_account: "@sidney.clips"
    style:
      language: de
      niche: [gaming, entertainment]
      tone: "energetisch, direkt"

# Globale Defaults für alle Creator (überschreibbar pro Creator)
defaults:
  clip:
    min_duration_sec: 60       # untere Grenze (> 60 s ideal für TikTok Creator Rewards)
    max_duration_sec: 120      # Obergrenze -> Clips bleiben im 1–2-Minuten-Fenster
    target_duration_sec: 90    # Ziel-Länge der Highlight-Ausschnitte (1,5 min)
    aspect_ratio: "9:16"
    reframe_mode: blur_pad     # blur_pad | crop
    burn_subtitles: true
    subtitle_position: top     # gesprochene Texte OBEN einblenden (top|middle|bottom)
    show_creator_credit: true  # faire Namensnennung; kein fremdes Wasserzeichen einbrennen
    max_clips_per_source: 3
    min_gap_sec: 60
  posting:
    uploader: zernio                     # zernio (empfohlen) | tiktok (Legacy-Direktupload)
    privacy_level: PUBLIC_TO_EVERYONE    # via Zernio kein eigenes TikTok-Audit nötig
    #                                    #   Zum Testen privat: SELF_ONLY
    schedule_mode: spread                # spread (gestaffelt planen) | now (sofort) | draft
    per_account_per_day: 3               # max. Clips pro Lauf/Konto
    first_delay_min: 20                  # erster geplanter Post: +20 min
    spacing_min: 180                     # Abstand zwischen geplanten Posts (3 h)
    timezone: Europe/Berlin
    require_human_review: false          # 'auto'-Lauf gibt ohnehin automatisch frei
